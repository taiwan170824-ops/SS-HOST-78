<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusBot — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060a12;--surface:#0d1321;--border:#1e2d45;--border-h:#2a3f5e;
  --accent:#5865f2;--accent-h:#6c79ff;--accent-glow:rgba(88,101,242,.35);
  --accent2:#00d4aa;--accent2-glow:rgba(0,212,170,.2);
  --text:#e8eef8;--muted:#6b7fa3;--muted2:#3d4f6b;--danger:#f04747;
  --font:'Inter',sans-serif;--mono:'JetBrains Mono',monospace;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--font);display:flex;align-items:center;justify-content:center;position:relative}
#bg-canvas{position:fixed;inset:0;z-index:0;opacity:.7}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:500px;height:500px;background:radial-gradient(circle,rgba(88,101,242,.18) 0%,transparent 70%);top:-100px;left:-100px;animation:orbFloat 12s ease-in-out infinite}
.orb2{width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,170,.12) 0%,transparent 70%);bottom:-80px;right:-80px;animation:orbFloat 15s ease-in-out infinite reverse}
@keyframes orbFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(30px,-20px)}66%{transform:translate(-20px,15px)}}
.wrap{position:relative;z-index:10;width:100%;max-width:420px;padding:1rem}
.card{background:rgba(13,19,33,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--border);border-radius:20px;padding:2.5rem 2.25rem;box-shadow:0 32px 80px rgba(0,0,0,.7),0 0 0 1px rgba(88,101,242,.08) inset,0 1px 0 rgba(255,255,255,.05) inset;animation:cardIn .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(32px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.logo-area{text-align:center;margin-bottom:2.25rem}
.logo-mark{width:64px;height:64px;background:linear-gradient(135deg,var(--accent) 0%,#7c3aed 100%);border-radius:18px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 1rem;box-shadow:0 0 40px var(--accent-glow),0 8px 24px rgba(0,0,0,.4);position:relative;animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 30px var(--accent-glow),0 8px 24px rgba(0,0,0,.4)}50%{box-shadow:0 0 55px var(--accent-glow),0 8px 24px rgba(0,0,0,.4)}}
.logo-mark::after{content:'';position:absolute;inset:-1px;border-radius:19px;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 50%);pointer-events:none}
.logo-title{font-size:1.6rem;font-weight:800;letter-spacing:-.04em;background:linear-gradient(135deg,#fff 0%,var(--accent-h) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-sub{font-size:.78rem;color:var(--muted);margin-top:.2rem;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.divider{display:flex;align-items:center;gap:.75rem;margin-bottom:1.75rem}
.divider span{font-size:.72rem;color:var(--muted2);white-space:nowrap;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.form-group{margin-bottom:1.25rem}
.form-label{display:block;font-size:.73rem;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.45rem}
.input-wrap{position:relative}
.input-icon{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted2);font-size:.9rem;pointer-events:none;transition:color .2s}
.form-input{width:100%;background:rgba(6,10,18,.6);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem .75rem 2.6rem;color:var(--text);font-family:var(--mono);font-size:.88rem;outline:none;transition:border-color .2s,box-shadow .2s}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.form-input::placeholder{color:var(--muted2);font-family:var(--font)}
.error-box{background:rgba(240,71,71,.08);border:1px solid rgba(240,71,71,.25);border-radius:10px;padding:.65rem .9rem;font-size:.82rem;color:#ff7575;margin-bottom:1.25rem;display:flex;align-items:center;gap:.5rem;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.btn-login{width:100%;background:linear-gradient(135deg,var(--accent) 0%,#7c3aed 100%);color:#fff;border:none;border-radius:10px;padding:.8rem;font-size:.92rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:opacity .2s,transform .1s,box-shadow .2s;box-shadow:0 4px 20px var(--accent-glow);position:relative;overflow:hidden;margin-top:.25rem;letter-spacing:.01em}
.btn-login::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 60%)}
.btn-login:hover{opacity:.92;box-shadow:0 6px 28px var(--accent-glow);transform:translateY(-1px)}
.btn-login:active{transform:scale(.98) translateY(0)}
.btn-login.loading .btn-text{opacity:0}
.btn-login.loading::after{content:'';position:absolute;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-footer{text-align:center;margin-top:1.5rem;font-size:.73rem;color:var(--muted2);line-height:1.6}
.login-footer code{font-family:var(--mono);background:rgba(255,255,255,.06);padding:.1rem .4rem;border-radius:4px;color:var(--muted);font-size:.72rem}
.status-bar{display:flex;align-items:center;justify-content:center;gap:1.5rem;margin-top:1.75rem}
.status-item{display:flex;align-items:center;gap:.35rem;font-size:.68rem;color:var(--muted2);font-weight:500}
.sdot{width:6px;height:6px;border-radius:50%;animation:statusPulse 2s ease-in-out infinite}
.sdot.green{background:var(--accent2);box-shadow:0 0 6px var(--accent2-glow)}
.sdot.blue{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
@keyframes statusPulse{0%,100%{opacity:1}50%{opacity:.4}}
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div class="wrap">
  <div class="card">
    <div class="logo-area">
      <div class="logo-mark">🤖</div>
      <div class="logo-title">NexusBot</div>
      <div class="logo-sub">Telegram Bot Hosting Panel</div>
    </div>
    <div class="divider"><span>Sign In</span></div>
    {% if error %}
    <div class="error-box"><span>⚠</span><span>{{ error }}</span></div>
    {% endif %}
    <form method="POST" action="/login" id="login-form">
      <div class="form-group">
        <label class="form-label">Admin Password</label>
        <div class="input-wrap">
          <span class="input-icon">🔒</span>
          <input type="password" name="password" class="form-input" placeholder="Enter your password" autofocus autocomplete="current-password">
        </div>
      </div>
      <button type="submit" class="btn-login" id="login-btn">
        <span class="btn-text">Sign In to Panel →</span>
      </button>
    </form>
    <div class="login-footer">Set password via <code>ADMIN_PASSWORD</code> env var</div>
    <div class="status-bar">
      <div class="status-item"><div class="sdot green"></div> Panel Online</div>
      <div class="status-item"><div class="sdot blue"></div> v2.0.0</div>
    </div>
  </div>
</div>

<script>
const canvas=document.getElementById('bg-canvas');
const ctx=canvas.getContext('2d');
let W,H,particles=[];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight;initP()}
function initP(){particles=[];const n=Math.floor(W*H/15000);for(let i=0;i<n;i++)particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25,r:Math.random()*1.4+.4,a:Math.random()*.5+.2,c:Math.random()>.6?'88,101,242':'0,212,170'})}
function draw(){ctx.clearRect(0,0,W,H);for(const p of particles){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(${p.c},${p.a})`;ctx.fill()}for(let i=0;i<particles.length;i++)for(let j=i+1;j<particles.length;j++){const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){ctx.beginPath();ctx.moveTo(particles[i].x,particles[i].y);ctx.lineTo(particles[j].x,particles[j].y);ctx.strokeStyle=`rgba(88,101,242,${.1*(1-d/110)})`;ctx.lineWidth=.5;ctx.stroke()}}requestAnimationFrame(draw)}
window.addEventListener('resize',resize);resize();draw();
document.getElementById('login-form').addEventListener('submit',()=>{document.getElementById('login-btn').classList.add('loading')});
</script>
</body>
</html>
